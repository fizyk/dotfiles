# Installs and configures everything on a fresh runner, then runs it all a
# second time to check that every task's `status:` detects its own work.
#
# Slow and network-heavy, so it runs on PRs (Renovate bumps included, which
# proves the new pins actually resolve), on demand, and weekly to catch
# upstream installers changing under us.
name: E2E

on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * 1"

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: go-task/setup-task@v2.2.0

      - name: Install
        run: task install
      - name: Configure
        run: |
          echo /snap/bin >> "$GITHUB_PATH"
          task config
      - name: Install pinned tools
        run: |
          PATH="/snap/bin:$PATH"
          task mise:tools

      - name: Smoke test
        run: |
          PATH="/snap/bin:$PATH"
          set -x
          zsh --version
          test -d ~/.oh-my-zsh
          test -f ~/.gitattributes
          test "$(git config --global init.defaultBranch)" = main
          getent group docker | grep -qw "$USER"
          test "$(getent passwd "$USER" | cut -d: -f7)" = "$(command -v zsh)"
          for d in themes/powerlevel10k plugins/zsh-syntax-highlighting plugins/zsh-autosuggestions; do
            test -d ~/.oh-my-zsh/custom/$d
          done
          grep -Fq 'mise activate zsh' ~/.zshrc
          grep -Fq 'task --completion zsh' ~/.zshrc
          test -x ~/.atuin/bin/atuin
          mise ls --installed

      # Task prints `task: [name] cmd` for every command it runs and
      # `task: Task "name" is up to date` for skipped ones, so on a second pass
      # any `[name]` line is a task whose status: check missed its own work.
      # git:config and zsh:config are left out: they have no status: by design
      # (git config is cheap to reapply; the zsh part only prints a reminder).
      - name: Second run changes nothing
        run: |
          set -o pipefail
          PATH="/snap/bin:$PATH"
          task install docker:config mise:config task:config mise:tools 2>&1 | tee rerun.log
          if grep -E '^task: \[' rerun.log; then
            echo "::error::The tasks above ran again on an already-provisioned machine"
            exit 1
          fi
