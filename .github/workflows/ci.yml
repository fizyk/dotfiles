name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      # The local `task-list` hook calls `task`.
      - uses: go-task/setup-task@v2.2.0
      - uses: j178/prek-action@v3.0.1

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: go-task/setup-task@v2.2.0
      - run: task test
