name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Linting lives in pre-commit.yml.
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: go-task/setup-task@v2.2.0
      - run: task test
