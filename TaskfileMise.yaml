# Mise (https://mise.jdx.dev) related tasks to perform
version: '3'

vars:
  ZSHRC_FILE: "~/.zshrc"
  MISE_FILE: "mise.toml"

tasks:
  clean:
    desc: Clean old mise installation
    internal: true
    cmds:
      - sudo rm -f /usr/local/bin/mise
    status:
      - test ! -f "/usr/local/bin/mise"

  install:
    desc: Install mise
    deps:
      - clean
    cmds:
      - sudo snap install mise --classic
    status:
      - mise --version

  config:
    desc: Configure mise (zsh activation)
    cmds:
      - echo 'eval "$(mise activate zsh)"' >> {{.ZSHRC_FILE}}
    preconditions:
      - test -f "$HOME/.zshrc"
    status:
      - grep -Fq 'mise activate zsh' {{.ZSHRC_FILE}}

  tools:
    desc: Install pinned tools via mise
    vars:
      TOOLS:
        sh: >-
          awk '/^\[tools\]/{f=1;next} /^\[/{f=0}
          f&&/=/{gsub(/["[:space:]]/,"");split($0,a,"=");if(a[1]!="")printf "%s@%s ",a[1],a[2]}'
          {{.MISE_FILE}}
    cmds:
      - mise use -g {{.TOOLS}}
    preconditions:
      - mise --version
    status:
      - |
        for t in {{.TOOLS}}; do
          case "${t#*@}" in latest) continue ;; esac
          mise current "${t%@*}" 2>/dev/null | grep -qw "${t#*@}" || exit 1
        done
