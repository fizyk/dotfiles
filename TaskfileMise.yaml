# Mise (https://mise.jdx.dev) related tasks to perform
version: '3'

vars:
  ZSHRC_FILE: "~/.zshrc"
  PYTHON_VERSION: "3.14.7"
  GO_VERSION: "1.27.1"
  LAZYDOCKER_VERSION: "0.25.2"
  PREK_VERSION: "0.5.2"
  UV_VERSION: "0.12.10"

tasks:
  clean:
    desc: Clean old mise installation
    internal: true
    cmds:
      - sudo rm -f /usr/local/bin/mise
    status:
      - test ! -f "/usr/local/bin/mise"

  install:
    desc: Install mise
    deps:
      - clean
    cmds:
      - sudo snap install mise --classic
    status:
      - mise --version

  config:
    desc: Configure mise (zsh activation)
    cmds:
      - echo 'eval "$(mise activate zsh)"' >> {{.ZSHRC_FILE}}
    preconditions:
      - test -f "$HOME/.zshrc"
    status:
      - grep -Fq 'mise activate zsh' {{.ZSHRC_FILE}}

  tools:
    desc: Install pinned tools via mise
    deps:
      - go
      - python
      - uv
      - prek
      - lazydocker

  go:
    internal: true
    cmds:
      - mise use -g go@{{.GO_VERSION}}
    preconditions:
      - mise --version
    status:
      - mise current go | grep -w {{.GO_VERSION}}

  python:
    internal: true
    desc: Install python {{.PYTHON_VERSION}}
    cmds:
      - mise use -g python@{{.PYTHON_VERSION}}
    preconditions:
      - mise --version
    status:
      - mise current python | grep -w {{.PYTHON_VERSION}}

  uv:
    internal: true
    cmds:
      - mise use -g uv@{{.UV_VERSION}}
    preconditions:
      - mise --version
    status:
      - mise current uv | grep -w {{.UV_VERSION}}

  prek:
    internal: true
    cmds:
      - mise use -g prek@{{.PREK_VERSION}}
    preconditions:
      - mise --version
    status:
      - mise current prek | grep -w {{.PREK_VERSION}}

  lazydocker:
    internal: true
    cmds:
      - mise use -g lazydocker@{{.LAZYDOCKER_VERSION}}
    preconditions:
      - mise --version
    status:
      - mise current lazydocker | grep -w {{.LAZYDOCKER_VERSION}}
