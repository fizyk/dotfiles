version: '3'

includes:
  git: TaskfileGit.yaml
  zsh: TaskfileZsh.yaml
  docker: TaskfileDocker.yaml
  mise: TaskfileMise.yaml
  atuin: TaskfileAtuin.yaml
  task: TaskfileTask.yaml

tasks:
  install:
    desc: "Installs all"
    cmds:
      - task: git:install
      - task: zsh:install
      - task: docker:install
      - task: mise:install
      - task: atuin:install
  config:
    desc: "Configures all"
    cmds:
      - task: git:config
      - task: zsh:config
      - task: docker:config
      - task: mise:config
      - task: task:config
  update:
    desc: "Updates everything that doesn't update itself"
    cmds:
      - task: zsh:update
      - task: atuin:update
  default:
    deps:
      [install]