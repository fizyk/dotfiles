# Atuin (https://atuin.sh) related tasks to perform
version: '3'

vars:
  ZSHRC_FILE: "~/.zshrc"

tasks:
  install:
    cmds:
      # Without a controlling terminal (CI, ssh without -t) setup.atuin.sh's
      # /dev/tty probe kills it with exit 2 and no output; --non-interactive
      # skips that probe and the history import/sync prompts.
      - |
        ARGS=""
        (: </dev/tty) 2>/dev/null || ARGS="--non-interactive"
        curl --proto '=https' --tlsv1.2 -LsSf https://setup.atuin.sh | sh -s -- $ARGS
    preconditions:
      - test -f "$HOME/.zshrc"
    status:
      - test -d ~/.atuin/bin
      - grep -Fq 'atuin' {{.ZSHRC_FILE}}

  update:
    cmds:
      - atuin update
    preconditions:
      - atuin --version
